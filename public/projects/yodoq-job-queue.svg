<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="yodoqGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#059669;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d9488;stop-opacity:1" />
    </linearGradient>
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feBlend mode="overlay" in="SourceGraphic"/>
    </filter>
  </defs>
  <rect width="600" height="400" fill="url(#yodoqGrad)"/>
  <rect width="600" height="400" fill="transparent" filter="url(#noise)" opacity="0.25"/>

  <!-- Distributed Queue Pipeline Illustration -->
  <g transform="translate(100, 80)">
    <!-- Main Queue Channel -->
    <rect x="0" y="70" width="400" height="80" rx="12" fill="#022c22" opacity="0.6" stroke="rgba(255,255,255,0.2)" stroke-width="2"/>
    
    <!-- Queue Slots / Task Blocks -->
    <g transform="translate(30, 85)">
      <!-- Task 1 (Committed / Active Lease) -->
      <rect x="0" y="0" width="65" height="50" rx="8" fill="#10b981" opacity="0.95"/>
      <text x="32" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#022c22" text-anchor="middle">JOB-01</text>
      
      <!-- Task 2 (Processing) -->
      <rect x="85" y="0" width="65" height="50" rx="8" fill="#34d399" opacity="0.95"/>
      <text x="117" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#022c22" text-anchor="middle">JOB-02</text>
      
      <!-- Task 3 (Queued) -->
      <rect x="170" y="0" width="65" height="50" rx="8" fill="#6ee7b7" opacity="0.9"/>
      <text x="202" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#022c22" text-anchor="middle">JOB-03</text>

      <!-- Task 4 (WAL Persisted) -->
      <rect x="255" y="0" width="65" height="50" rx="8" fill="#a7f3d0" opacity="0.8"/>
      <text x="287" y="30" font-family="monospace" font-size="12" font-weight="bold" fill="#022c22" text-anchor="middle">WAL</text>
    </g>

    <!-- Top Flow Indicator -->
    <g transform="translate(40, 20)">
      <circle cx="10" cy="10" r="6" fill="#34d399"/>
      <line x1="25" y1="10" x2="310" y2="10" stroke="rgba(255,255,255,0.4)" stroke-width="2" stroke-dasharray="6,6"/>
      <polygon points="320,10 310,5 310,15" fill="#34d399"/>
      <text x="160" y="-2" font-family="monospace" font-size="11" fill="white" opacity="0.8" text-anchor="middle">AT-LEAST-ONCE DISPATCH</text>
    </g>

    <!-- Bottom Metrics -->
    <g transform="translate(50, 190)">
      <rect x="0" y="0" width="130" height="34" rx="6" fill="black" opacity="0.4"/>
      <text x="65" y="21" font-family="monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">0% JOB LOSS</text>

      <rect x="170" y="0" width="130" height="34" rx="6" fill="black" opacity="0.4"/>
      <text x="235" y="21" font-family="monospace" font-size="11" fill="#6ee7b7" text-anchor="middle">50% FAULT TOL</text>
    </g>
  </g>
</svg>
